name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      # Locator synthesis is verified against a real Chromium accessibility tree, so the
      # browser is a test dependency. Cached on the resolved playwright version.
      - name: Resolve playwright version
        id: pw
        run: |
          V=$(uv run python -c "from importlib.metadata import version; print(version('playwright'))")
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Cache browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install chromium
        run: uv run playwright install --with-deps chromium

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Tests
        run: uv run pytest
