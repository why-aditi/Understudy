[project]
name = "cua"
version = "0.1.0"
description = "Discover a UI capability with an LLM, record it as a typed artifact, replay it deterministically."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.28.1",
    "playwright>=1.62.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.3",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "uvicorn>=0.52.4",
]

[project.scripts]
cua = "cua.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "types-pyyaml>=6.0.12.20260906",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20260518",
    "uiautomation>=2.0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Include the repo root so `apps` resolves as first-party. Without it ruff calls it a
# third-party import here and a first-party one elsewhere, which diverges from CI.
src = [".", "src", "tests"]
# design docs contain python code blocks; ruff must not reformat them
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "ANN",  # every function is annotated
    "BLE",  # no blind except
    "T20",  # no print in library code
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# scripts/ are one-shot entry points whose output *is* the deliverable.
"scripts/*" = ["T201"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src", "tests"]
warn_unreachable = true
disallow_any_unimported = true
files = ["src", "tests", "apps", "scripts"]

# uiautomation ships no py.typed and exists only on Windows, so the desktop proof would
# otherwise be the one deliverable script mypy could not check at all.
[[tool.mypy.overrides]]
module = "uiautomation.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# apps/ is dev tooling, not part of the wheel, so it needs the repo root on the path.
pythonpath = ["."]
