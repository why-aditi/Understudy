{% extends "_base.html" %}
{% block title %}Member search{% endblock %}
{% block heading %}Member search{% endblock %}
{% block body %}
{% if message %}<p id="{{ eid() }}"><font color="#990000">{{ message }}</font></p>{% endif %}
<form method="get" action="/{{ tenant }}/members" name="memberSearch" id="{{ eid() }}">
{% if fail %}<input type="hidden" name="fail" value="{{ fail }}">{% endif %}
<table border="0" cellpadding="3" id="{{ eid() }}">
<tr>
  <td id="{{ eid() }}"><label for="{{ 'q' }}" id="{{ eid() }}">{{ labels.member_label }}</label></td>
  <td id="{{ eid() }}"><input type="text" name="q" id="q" size="20"></td>
  <td id="{{ eid() }}">
    <a href="#" id="{{ eid() }}"
       onclick="document.forms['memberSearch'].submit(); return false;">Search</a>
  </td>
</tr>
</table>
</form>
{% endblock %}
